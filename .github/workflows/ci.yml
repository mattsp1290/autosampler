name: CI
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: ["", "serde"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --all-targets --features "${{ matrix.features }}"
      - run: cargo test --locked --all-targets --features "${{ matrix.features }}"
      - run: cargo clippy --locked --all-targets --features "${{ matrix.features }}" -- -D warnings
      - run: cargo doc --locked --no-deps --features "${{ matrix.features }}"
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run --locked --example list_devices
        timeout-minutes: 1
        if: hashFiles('examples/list_devices.rs') != ''
