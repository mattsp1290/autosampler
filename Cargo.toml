[package]
name = "autosampler"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "MIDI-driven hardware audio recording and silence boundary detection"
repository = "https://github.com/mattsp1290/autosampler"
readme = "README.md"
include = ["src/**", "examples/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "docs/publication-audit.md"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
cpal = "=0.17.1"
midir = "=0.10.3"
hound = "=3.5.1"
thiserror = "=2.0.18"
tracing = "=0.1.44"
serde = { version = "=1.0.228", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
serde_json = "1"
